# GENERADO por scripts/generate_cms_config.mjs — no editar a mano.
# Para cambiarlo: edita el script (o GUIDE_MODULES en src/lib/guideNav.ts) y
# ejecuta "npm run generate:cms".
#
# Panel de contenido (Sveltia CMS) servido en /admin. Una colección por
# sección/módulo del menú, cada una con su formulario.
# Pendiente (producción): backend.base_url del Sveltia CMS Authenticator para
# iniciar sesión con GitHub. Mientras tanto: "Trabajar con repositorio local"
# (Chrome/Edge) o un token personal de GitHub.
backend:
  name: github
  repo: pgayos/ATURNOS-MANUAL
  branch: main
publish_mode: editorial_workflow
site_url: https://manual.aturnos.com
media_folder: public/media/manual
public_folder: /media/manual
slug:
  encoding: ascii
  clean_accents: true
output:
  yaml:
    indent_sequences: true
    quote: none
collections:
  - name: empezar-en-aturnos
    label: Cómo empezar
    label_singular: artículo
    icon: rocket_launch
    description: "Empezar en aTurnos. URL: /manual/empezar-en-aturnos/<nombre-del-archivo>/"
    folder: src/content/manual/empezar-en-aturnos
    extension: md
    format: frontmatter
    create: true
    slug: "{{title}}"
    identifier_field: title
    summary: "{{submodule}} › {{subtopic}} › {{title}}"
    sortable_fields:
      - title
      - submodule
    view_groups:
      - label: Submódulo
        field: submodule
    preview_path: manual/empezar-en-aturnos/{{slug}}/
    fields:
      - name: schemaVersion
        widget: hidden
        default: "1.0"
      - name: contentId
        widget: hidden
        default: empezar-en-aturnos-{{uuid_short}}
      - name: title
        label: Título
        widget: string
        minlength: 5
        hint: Lo que verá el usuario en el menú y en la cabecera del artículo.
      - name: order
        widget: hidden
        default: 99
      - name: description
        label: Descripción
        widget: text
        minlength: 30
        hint: Resumen de una frase (mínimo 30 caracteres). Aparece en buscadores y listados.
      - name: contentType
        widget: hidden
        default: procedure
      - name: module
        widget: hidden
        default: Empezar en aTurnos
      - name: submodule
        label: "Pertenece a: submódulo de Empezar en aTurnos"
        widget: select
        options:
          - Introducción
          - Comienza en aTurnos
          - Vacaciones y permisos (absentismos)
          - El Cuadrante
          - Control horario
          - Guías por rol
        hint: "Dónde aparece en el menú: Empezar en aTurnos › este submódulo. Si falta uno, hay que añadirlo a la estructura del manual (no se crea desde aquí)."
      - name: subtopic
        label: "Pertenece a: tema dentro del submódulo"
        widget: relation
        required: false
        collection: estructura
        value_field: subtopic
        display_fields:
          - subtopic
        search_fields:
          - subtopic
        filters:
          - field: module
            values:
              - Empezar en aTurnos
          - field: submodule
            values:
              - "{{fields.submodule}}"
        hint: "Opcional: solo si el submódulo agrupa sus artículos por temas. Elige primero el submódulo."
      - name: intent
        widget: compute
        value: "{{fields.title}}"
      - name: audience
        label: Roles
        label_singular: rol
        widget: list
        min: 1
        summary: "{{fields.role}}"
        hint: Quién necesita este artículo. Cada rol ve lo suyo y lo de los roles inferiores (Trabajador < Administrador < RRHH).
        fields:
          - name: role
            label: Rol
            widget: select
            options:
              - Trabajador
              - Administrador
              - RRHH
              - Nóminas
              - Desarrollador API
          - name: access
            widget: hidden
            default: applicable
      - name: entities
        widget: hidden
        default: []
      - name: synonyms
        widget: hidden
        default: []
      - name: relatedTerms
        widget: hidden
        default: []
      - name: prerequisites
        label: Requisitos previos
        widget: list
        required: false
      - name: platforms
        widget: hidden
        default:
          - web
      - name: video
        label: Vídeo
        widget: file
        required: false
        accept: video/*
        choose_url: true
        hint: "Opcional: sube un vídeo o pega la URL de YouTube. Se muestra al inicio del artículo."
      - name: governance
        label: Gestión editorial
        widget: object
        collapsed: true
        fields:
          - name: status
            label: Estado
            widget: select
            default: draft
            options:
              - label: Borrador
                value: draft
              - label: En revisión
                value: functional-review
              - label: Publicado
                value: published
              - label: Obsoleto
                value: deprecated
          - name: owner
            label: Autor
            widget: string
            default: Equipo de Producto de aTurnos
            hint: Aparece en la tarjeta "Autor" del artículo.
          - name: reviewer
            widget: hidden
            default: null
          - name: reviewedAt
            widget: hidden
            default: null
          - name: reviewDueAt
            widget: hidden
            default: null
          - name: sourceUrls
            label: Fuentes
            widget: list
            required: false
            hint: URLs completas (https://…) de donde sale la información.
          - name: redirectsFrom
            widget: hidden
            default: []
      - name: ai
        label: Inteligencia artificial (opcional)
        widget: object
        collapsed: true
        hint: "Aún no se usa en el sitio: prepara el artículo para el futuro asistente con IA del manual."
        fields:
          - name: answerableQuestions
            label: Preguntas que responde este artículo
            widget: list
            required: false
            hint: Opcional. Escríbelas como las haría un usuario, p. ej. "¿Cómo creo un cuadrante borrador?". La IA las usará para saber cuándo recomendar este artículo.
          - name: excludedQuestions
            widget: hidden
            default: []
          - name: sensitivity
            widget: hidden
            default: public
          - name: chunking
            widget: hidden
            default: by-section
      - name: readingTime
        label: Tiempo de lectura (min)
        widget: number
        value_type: int
        min: 1
        default: 2
      - name: featured
        label: Destacado
        widget: boolean
        default: false
        hint: Aparece en "Contenido destacado" de la home.
      - name: migration
        widget: hidden
      - name: labels
        label: Etiquetas
        widget: select
        multiple: true
        required: false
        default: []
        options:
          - label: Pendiente
            value: PENDIENTE
      - name: body
        label: Contenido
        widget: markdown
        hint: 'Usa encabezados "##" (Resumen, Procedimiento…). Para añadir capturas o archivos usa el botón de imagen/archivo de la barra: se suben a "Imágenes y archivos del manual".'
