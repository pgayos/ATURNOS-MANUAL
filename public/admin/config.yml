            widget: select
            default: draft
            options:
              - label: Borrador
                value: draft
              - label: En revisión
                value: functional-review
              - label: Publicado
                value: published
              - label: Obsoleto
                value: deprecated
          - name: owner
            label: Autor
            widget: string
            default: Equipo de Producto de aTurnos
            hint: Aparece en la tarjeta "Autor" del artículo.
          - name: reviewer
            widget: hidden
            default: null
          - name: reviewedAt
            widget: hidden
            default: null
          - name: reviewDueAt
            widget: hidden
            default: null
          - name: sourceUrls
            label: Fuentes
            widget: list
            required: false
            hint: URLs completas (https://…) de donde sale la información.
          - name: redirectsFrom
            widget: hidden
            default: []
      - name: ai
        label: Inteligencia artificial (opcional)
        widget: object
        collapsed: true
        hint: "Aún no se usa en el sitio: prepara el artículo para el futuro asistente con IA del manual."
        fields:
          - name: answerableQuestions
            label: Preguntas que responde este artículo
            widget: list
            required: false
            hint: Opcional. Cómo preguntaría un usuario por este término, p. ej. "¿Qué es Turno?".
          - name: excludedQuestions
            widget: hidden
            default: []
          - name: sensitivity
            widget: hidden
            default: public
          - name: chunking
            widget: hidden
            default: by-section
      - name: readingTime
        widget: hidden
        default: 1
      - name: featured
        widget: hidden
        default: false
      - name: migration
        widget: hidden
      - name: labels
        label: Etiquetas
        widget: select
        multiple: true
        required: false
        default: []
        options:
          - label: Pendiente
            value: PENDIENTE
      - name: body
        label: Definición completa
        widget: markdown
        hint: Empieza con "## Resumen" y la definición completa del término.
  - divider: true
  - name: estructura
    label: Estructura del manual
    icon: account_tree
    description: 'Solo lectura: temas de cada submódulo. Se genera con "npm run generate:cms" a partir del contenido.'
    folder: cms/estructura
    extension: yml
    format: yaml
    create: false
    delete: false
    readonly: true
    identifier_field: subtopic
    summary: "{{module}} › {{submodule}} › {{subtopic}}"
    view_groups:
      - label: Módulo
        field: module
    fields:
      - name: module
        label: Módulo
        widget: string
      - name: submodule
        label: Submódulo
        widget: string
      - name: subtopic
        label: Tema
        widget: string
asset_collections:
  - name: medios
    label: Imágenes y archivos del manual
    icon: photo_library
    media_folder: public/media/manual
    public_folder: /media/manual
